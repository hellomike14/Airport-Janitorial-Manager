          description: Existing linked assignments, filtered by actor visibility and source email date.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InspectorAssignmentReport"
        "400": { description: Invalid or incomplete date range }
        "401": { description: Login session required }
        "403": { description: Role is not allowed to view inspector assignments }

