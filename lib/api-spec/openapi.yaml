              schema: { $ref: "#/components/schemas/PettyCashReceiptUploadReservation" }
        "400": { description: Unsupported or oversized receipt image }
        "401": { description: Login session required }
        "403": { description: Manager access required }
        "429": { description: Upload rate limit reached }
        "423": { description: Protected Operations access is locked }

  /operations/petty-cash/receipts/uploads/{uploadId}:
    parameters:
      - name: uploadId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: deletePettyCashReceiptDraft
      tags: [operations]
      summary: Remove a draft receipt image that has not been attached to a reconciliation
      responses:
        "204": { description: Draft image removed }
        "401": { description: Login session required }
        "403": { description: Manager access required }
        "404": { description: Upload not found }
        "409": { description: Attached receipt cannot be deleted because history refers to it }
        "423": { description: Protected Operations access is locked }

  /operations/petty-cash/receipts/uploads/{uploadId}/complete:
    parameters:
      - name: uploadId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: completePettyCashReceiptUpload
      tags: [operations]
      summary: Validate and finalize a private receipt image
      responses:
        "200":
          description: Verified uploaded receipt metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PettyCashReceiptUploadComplete" }
        "400": { description: Invalid receipt image }
        "401": { description: Login session required }
        "403": { description: Manager access required }
        "404": { description: Upload not found }
        "409": { description: Upload is incomplete or already attached }
        "410": { description: Upload reservation expired }
        "423": { description: Protected Operations access is locked }
  /operations/petty-cash/receipts/{attachmentId}/preview:
    get:
      operationId: previewPettyCashReceipt
      tags: [operations]
      summary: View a private receipt attached to a protected reconciliation
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Private image bytes.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "401": { description: Login session required }
        "403": { description: Manager access required }
        "404": { description: Receipt not found }
        "423": { description: Protected Operations access is locked }

  /operations/petty-cash/receipts/{attachmentId}/download:
    get:
      operationId: downloadPettyCashReceipt
      tags: [operations]
      summary: Download a private receipt attached to a protected reconciliation
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Private image bytes as a download.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "401": { description: Login session required }
        "403": { description: Manager access required }
        "404": { description: Receipt not found }
        "423": { description: Protected Operations access is locked }

  /operations/petty-cash/{recordId}:
    parameters:
      - name: recordId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      operationId: updatePettyCashRecord
      tags: [operations]
      summary: Update a reconciliation with optimistic version checking
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PettyCashRecordUpdate" }
      responses:
        "200":
          description: Saved reconciliation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PettyCashRecord" }
        "400": { description: Invalid record or acknowledgement data }
        "401": { description: Login session required }
        "403": { description: Manager access required }
        "404": { description: Reconciliation not found }
        "409": { description: Record changed; reload before saving }
        "423": { description: Protected Operations access is locked }

  /operations/petty-cash/{recordId}/history:
    get:
      operationId: listPettyCashRecordHistory
      tags: [operations]
      summary: List immutable Petty Cash change history
      parameters:
        - name: recordId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Saved record snapshots, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PettyCashHistoryEntry" }
        "401": { description: Login session required }
        "403": { description: Manager access required }
        "404": { description: Reconciliation not found }
        "423": { description: Protected Operations access is locked }

  /operations/petty-cash/{recordId}/export.csv:
    get:
      operationId: exportPettyCashRecordCsv
      tags: [operations]
      summary: Download a completed reconciliation as formula-safe CSV
      parameters:
        - name: recordId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Printable/exportable completed record.
          content:
            text/csv:
              schema: { type: string }
        "401": { description: Login session required }
        "403": { description: Manager access required }
        "404": { description: Reconciliation not found }
        "409": { description: Reconciliation must be completed before export }
        "423": { description: Protected Operations access is locked }

  /operations/uniform-stock:
    get:
      operationId: listUniformStockItems
      tags: [operations]
      summary: List current and archived Uniform Stock items
      responses:
        "200":
          description: Current quantities, reorder levels and outstanding issues.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UniformStockItem" }
        "401": { description: Login session required }
        "403": { description: Manager access required }
        "423": { description: Protected Operations access is locked }

  /operations/uniform-stock/items:
    post:
      operationId: createUniformStockItem
      tags: [operations]
      summary: Add an item with an explicitly manager-entered opening balance
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UniformStockItemInput" }
      responses:
        "201":
          description: Created item and immutable opening-balance transaction.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UniformStockItem" }
        "400": { description: Invalid item or opening balance }
        "401": { description: Login session required }
        "403": { description: Manager access required }
        "409": { description: An active item with this name and size already exists }
        "423": { description: Protected Operations access is locked }

  /operations/uniform-stock/items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      operationId: updateUniformStockItem
      tags: [operations]
      summary: Update item details, reorder level or active status
      description: Quantity changes must be recorded as stock transactions; items are archived, never deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UniformStockItemUpdate" }
      responses:
        "200":
          description: Updated stock item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UniformStockItem" }
        "400": { description: Invalid item details }
        "401": { description: Login session required }
        "403": { description: Manager access required }
        "404": { description: Stock item not found }
        "409": { description: Item changed; reload before saving }
        "423": { description: Protected Operations access is locked }

  /operations/uniform-stock/transactions:
    get:
      operationId: listUniformStockTransactions
      tags: [operations]
      summary: List immutable stock receipts, issues, returns and adjustments
      responses:
        "200":
          description: Transaction history with staff and item names.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UniformStockTransaction" }
        "401": { description: Login session required }
        "403": { description: Manager access required }
        "423": { description: Protected Operations access is locked }
    post:
      operationId: createUniformStockTransaction
      tags: [operations]
      summary: Record a stock receipt, staff issue, return or adjustment
      description: New issues require an active, non-former staff/supervisor/admin. Returns reference an original issue and remain allowed for former or inactive staff.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UniformStockTransactionInput" }
      responses:
        "201":
          description: Stock transaction recorded with the resulting item balance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UniformStockTransaction" }
        "400": { description: Invalid transaction or staff is not eligible for a new issue }
        "401": { description: Login session required }
        "403": { description: Manager access required }
        "404": { description: Item or original issue not found }
        "409": { description: Insufficient stock or an issue was already fully returned }
        "423": { description: Protected Operations access is locked }

  /operations/uniform-stock/export.csv:
    get:
      operationId: exportUniformStockCsv
      tags: [operations]
      summary: Download a formula-safe stock list or distribution history
      parameters:
        - name: view
          in: query
          required: true
          schema: { type: string, enum: [stock, history] }
      responses:
        "200":
          description: CSV export of the selected view.
          content:
            text/csv:
              schema: { type: string }
        "400": { description: Unsupported export view }
        "401": { description: Login session required }
        "403": { description: Manager access required }
        "423": { description: Protected Operations access is locked }

  /internal/inspector-sla-sweep:
    post:
      operationId: runInspectorSlaSweep
      tags: [internal]
      summary: Internal scheduler trigger for overdue inspector assignments
      security:
        - InternalCronSecret: []
      responses:
        "202": { description: Idempotent sweep completed }
        "401": { description: Invalid scheduler credential }

  /auth-diagnostics/events:
    post:
      operationId: reportAuthDiagnosticEvent
      tags: [authDiagnostics]
      summary: Report a limited authentication availability diagnostic
      description: Accepts a limited set of diagnostic codes without requiring an authenticated session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthDiagnosticEventInput"
      responses:
        "201":
          description: Diagnostic event recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthDiagnosticEventReceipt"
        "400":
          description: Diagnostic code is not accepted from unauthenticated clients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidDiagnosticCodeError"
        "429":
          description: Too many diagnostic reports
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthDiagnosticRateLimitError"
        "503":
          description: The diagnostic event could not be persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticStoreUnavailableError"

  /auth-diagnostics:
    get:
      operationId: getAuthDiagnostics
      tags: [authDiagnostics]
      summary: Get authentication diagnostics and staff access audit history
      description: Available only to authenticated administrators.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Authentication diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthDiagnostics"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /employment-forms/{formId}:
    get:
      operationId: getEmploymentFormTemplate
      tags: [Employment]
      summary: Open or download an allowlisted blank employment template PDF
      description: Non-restricted blank templates are public. Seven onboarding templates require a verified Admin session and confidential access code. Completed records are never served from this route.
      parameters:
        - name: formId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/EmploymentFormTemplateId"
        - name: download
          in: query
          required: false
          schema:
            type: string
            enum: ["1"]
          description: Set to 1 to download instead of opening inline.
      responses:
        "200":
          description: Allowlisted blank PDF template
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid download option
        "403":
          description: Administrator and confidential access required for restricted templates
        "404":
          description: Template not found
        "503":
          description: Template temporarily unavailable

  /employment-forms/job-application:
    get:
      operationId: getEmploymentJobApplication
      tags: [Employment]
      summary: Open or download the original fillable Marvol job application
      description: Public blank fillable template; exposes no submitted application data.
      parameters:
        - name: download
          in: query
          required: false
          schema:
            type: string
            enum: ["1"]
          description: Set to 1 to download instead of opening inline.
      responses:
        "200":
          description: Original fillable application PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid download option
        "404":
          description: Application PDF not found
        "503":
          description: Application PDF temporarily unavailable
  /employment-forms/i-9:
    get:
      operationId: getEmploymentI9Form
      tags: [Employment]
      summary: Open or download the original fillable I-9 PDF
      description: Public blank fillable template; exposes no submitted I-9 data.
      parameters:
        - name: download
          in: query
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: Original fillable I-9 PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid download option
        "404":
          description: Form not found
        "503":
          description: Form temporarily unavailable
  /employment-forms/w-4:
    get:
      operationId: getEmploymentW4Form
      tags: [Employment]
      summary: Open or download the original fillable 2026 W-4 PDF
      description: Public blank fillable template; exposes no submitted W-4 data.
      parameters:
        - name: download
          in: query
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: Original fillable W-4 PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid download option
        "404":
          description: Form not found
        "503":
          description: Form temporarily unavailable
  /employment-forms/{formId}/email:
    post:
      operationId: emailEmploymentBlankForm
      tags: [Employment]
      summary: Send a fixed blank employment template PDF to a validated recipient
      description: Per-IP rate-limited. Only a server-allowlisted template is attached; client file and URL inputs are rejected. Restricted onboarding templates require a verified Admin session and confidential access code.
      parameters:
        - name: formId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/EmploymentFormTemplateId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmploymentPdfEmailInput"
      responses:
        "202":
          description: The configured email provider accepted the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedEmailResponse"
        "400": { description: Invalid form id or recipient address }
        "404": { description: Template not found }
        "413": { description: PDF exceeds the supported attachment limit }
        "429": { description: Public email rate limit exceeded }
        "502": { description: Email provider rejected the message }
        "503": { description: Email delivery is not configured or the template is unavailable }
  /employee-training/video:
    get:
      operationId: getEmployeeTrainingVideo
      summary: Private employee training video with HTTP byte ranges
      parameters:
        - in: header
          name: Range
          schema: { type: string }
      responses:
        "200":
          description: Full video
          content:
            video/mp4:
              schema: { type: string, format: binary }
        "206":
          description: Requested video byte range
          content:
            video/mp4:
              schema: { type: string, format: binary }
        "401": { description: Verified staff session required }
        "403": { description: Employee Portal access required }
        "416": { description: Invalid or unsatisfiable byte range }
  /employee-training/status:
    get:
      operationId: getEmployeeTrainingStatus
      summary: Current employee's progress and retained attestations
      responses:
        "200":
          description: Own training status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmployeeTrainingStatus" }
  /employee-training/session:
    post:
      operationId: startEmployeeTrainingSession
      summary: Start one watch session for the signed-in employee
      responses:
        "200":
          description: Watch session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingSession" }
  /employee-training/progress:
    post:
      operationId: updateEmployeeTrainingProgress
      summary: Record validated contiguous playback coverage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrainingHeartbeat" }
      responses:
        "200":
          description: Persisted watch coverage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingWatchStatus" }
        "409": { description: Superseded watch session }
  /employee-training/acknowledgment:
    post:
      operationId: acknowledgeEmployeeTraining
      summary: Save one immutable employee attestation per version
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrainingAttestationInput" }
      responses:
        "200":
          description: Saved employee attestation and history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmployeeTrainingStatus" }
        "400": { description: "Invalid confirmation, signature or version" }
        "409": { description: Full video not watched }
  /employee-training/review:
    get:
      operationId: getEmployeeTrainingReview
      summary: Manager-only current completion and historical employee attestations
      responses:
        "200":
          description: Manager review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingReview" }
        "403": { description: Manager access required }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    InternalCronSecret:
      type: apiKey
      in: header
      name: X-Internal-Cron-Secret
    SendGridInboundSecret:
      type: apiKey
      in: header
      name: X-SendGrid-Inbound-Secret
  schemas:
    InspectorAssignmentHistoryItem:
      type: object
      required: [assignedStaffId, assignedById, event, method, distanceMeters, provenance, createdAt]
      properties:
        assignedStaffId: { type: integer }
        assignedById: { type: ["integer", "null"] }
        event: { type: string, enum: [assigned, reassigned] }
        method: { type: string, enum: [fresh_gps, area_roster_workload] }
        distanceMeters: { type: ["number", "null"] }
        provenance: { type: string }
        createdAt: { type: string, format: date-time }
    InspectorAssignmentReport:
      type: object
      required: [source, sourceEmail, task, area, assignedStaff, assignmentMethod, assignmentDistanceMeters, dueAt, remainingSeconds, status, escalatedAt, history]
      properties:
        source:
          type: object
          required: [conversationId, messageId]
          properties:
            conversationId: { type: integer }
            messageId: { type: integer }
        sourceEmail:
          type: object
          required: [senderEmail, subject, body, storedMessageBody, receivedAt]
          properties:
            senderEmail: { type: ["string", "null"] }
            subject: { type: ["string", "null"] }
            body: { type: ["string", "null"] }
            storedMessageBody: { type: string }
            receivedAt: { type: string, format: date-time }
        task:
          type: object
          required: [id, name, taskDate, completed, completedAt, completedById, taskNotes, beforeImagePath, afterImagePath, createdAt]
          properties:
            id: { type: integer }
            name: { type: string }
            taskDate: { type: string, description: "Scheduled task date in YYYY-MM-DD form." }
            completed: { type: boolean }
            completedAt: { type: ["string", "null"], format: date-time }
            completedById: { type: ["integer", "null"] }
            taskNotes: { type: ["string", "null"] }
            beforeImagePath: { type: ["string", "null"] }
            afterImagePath: { type: ["string", "null"] }
            createdAt: { type: string, format: date-time }
        area:
          type: object
          required: [id, name, terminal]
          properties:
            id: { type: integer }
            name: { type: string }
            terminal: { type: string }
        assignedStaff:
          type: ["object", "null"]
          required: [id, name]
          properties:
            id: { type: integer }
            name: { type: string }
        assignmentMethod: { type: string, enum: [fresh_gps, area_roster_workload] }
        assignmentDistanceMeters: { type: ["number", "null"] }
        dueAt: { type: string, format: date-time }
        remainingSeconds: { type: integer, minimum: 0 }
        status: { type: string, enum: [assigned, overdue, escalated, completed] }
        escalatedAt: { type: ["string", "null"], format: date-time }
        history:
          type: array
          items:
            $ref: "#/components/schemas/InspectorAssignmentHistoryItem"
    TrainingVersion:
      type: object
      required: [version, title, duration, videoUrl]
      properties:
        version: { type: string }
        title: { type: string }
        duration: { type: number }
        videoUrl: { type: string }
    TrainingWatchStatus:
      type: object
      required: [watchedSeconds, eligible]
      properties:
        watchedSeconds: { type: number }
        eligible: { type: boolean }
    TrainingAcknowledgment:
      type: object
      required: [id, staffId, version, trainingTitle, videoSha256, signature, staffName, watchedConfirmation, understoodConfirmation, completedAt]
      properties:
        id: { type: integer }
        staffId: { type: integer }
        version: { type: string }
        trainingTitle: { type: string }
        videoSha256: { type: string }
        signature: { type: string }
        staffName: { type: string }
        watchedConfirmation: { type: boolean }
        understoodConfirmation: { type: boolean }
        completedAt: { type: string, format: date-time }
    EmployeeTrainingStatus:
      type: object
      required: [training, staff, watchedSeconds, eligible, acknowledgment, history]
      properties:
        training: { $ref: "#/components/schemas/TrainingVersion" }
        staff:
          type: object
          required: [id, name]
          properties:
            id: { type: integer }
            name: { type: string }
        watchedSeconds: { type: number }
        eligible: { type: boolean }
        acknowledgment:
          anyOf:
            - $ref: "#/components/schemas/TrainingAcknowledgment"
            - type: "null"
        history:
          type: array
          items: { $ref: "#/components/schemas/TrainingAcknowledgment" }
    TrainingSession:
      type: object
      required: [sessionId, resumePosition]
      properties:
        sessionId: { type: string, format: uuid }
        resumePosition: { type: number, minimum: 0 }
    TrainingHeartbeat:
      type: object
      additionalProperties: false
      required: [sessionId, version, position, playing, seeking, rate]
      properties:
        sessionId: { type: string, format: uuid }
        version: { type: string }
        position: { type: number, minimum: 0 }
        playing: { type: boolean }
        seeking: { type: boolean }
        rate: { type: number, minimum: 0.25, maximum: 2 }
    TrainingAttestationInput:
      type: object
      additionalProperties: false
      required: [version, watched, understood, fullName]
      properties:
        version: { type: string }
        watched: { type: boolean, const: true }
        understood: { type: boolean, const: true }
        fullName: { type: string, minLength: 1, maxLength: 200 }
    TrainingEmployeeReview:
      type: object
      required: [staffId, name, active, formerEmployee, status, watchedSeconds, eligible, acknowledgment, history]
      properties:
        staffId: { type: integer }
        name: { type: string }
        active: { type: boolean }
        formerEmployee: { type: boolean }
        status: { type: string, enum: [pending, completed] }
        watchedSeconds: { type: number }
        eligible: { type: boolean }
        acknowledgment:
          anyOf:
            - $ref: "#/components/schemas/TrainingAcknowledgment"
            - type: "null"
        history:
          type: array
          items: { $ref: "#/components/schemas/TrainingAcknowledgment" }
    TrainingReview:
      type: object
      required: [training, employees]
      properties:
        training: { $ref: "#/components/schemas/TrainingVersion" }
        employees:
          type: array
          items: { $ref: "#/components/schemas/TrainingEmployeeReview" }
    SetConversationArchiveRequest:
      type: object
      required: [staffId, archived]
      properties:
        staffId: { type: integer }
        archived: { type: boolean }
    SendgridInboundReplyRequest:
      type: object
      required: [envelope, from, text]
      properties:
        envelope:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: email }
            to: { type: array, items: { type: string, format: email } }
        from: { type: string, format: email }
        text: { type: string, maxLength: 2000 }
        headers: { type: string }
        SPF: { type: string }
        dkim: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SessionExpiredError:
      type: object
      required: [error, diagnosticId]
      properties:
        error:
          type: string
          enum: [SESSION_EXPIRED]
        diagnosticId:
