        "403": { description: Manager access required }
        "423": { description: Protected Operations access is locked }

  /operations/petty-cash/receipts/uploads:
    post:
      operationId: reservePettyCashReceiptUpload
      tags: [operations]
      summary: Create a short-lived private receipt-photo upload reservation
      requestBody:
