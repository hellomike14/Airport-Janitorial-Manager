openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Marvol Facility Cleaning Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: staff
    description: Staff management
  - name: areas
    description: Cleaning areas
  - name: tasks
    description: Task management
  - name: assignments
    description: Task assignments
  - name: issues
    description: Issue reporting
  - name: notifications
    description: In-app notifications
  - name: messages
    description: Direct messaging between roles
  - name: taskTypes
    description: Task type templates
  - name: Storage
    description: Object storage upload and serving endpoints.

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /staff:
    get:
      operationId: listStaff
      tags: [staff]
      summary: List all staff members
      responses:
        "200":
          description: List of staff
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
    post:
      operationId: createStaffMember
      tags: [staff]
      summary: Create a staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffMemberRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"

  /staff/{id}:
    put:
      operationId: updateStaffMember
      tags: [staff]
      summary: Update a staff member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStaffMemberRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
    delete:
      operationId: deleteStaffMember
      tags: [staff]
      summary: Delete a staff member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  /areas:
    get:
      operationId: listAreas
      tags: [areas]
      summary: List all cleaning areas
      responses:
        "200":
          description: List of areas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CleaningArea"

  /areas/{areaId}/effective-tasks:
    get:
      operationId: listAreaEffectiveTasks
      tags: [areas]
      summary: List the effective task list for an area with included/excluded state
      parameters:
        - name: areaId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Effective tasks for the area
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AreaEffectiveTask"

  /areas/{areaId}/exclusions:
    post:
      operationId: addAreaTaskExclusion
      tags: [areas]
      summary: Mark a task as not applicable for an area
      parameters:
        - name: areaId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAreaTaskExclusionRequest"
      responses:
        "201":
          description: Exclusion recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  /areas/{areaId}/exclusions/remove:
    post:
      operationId: removeAreaTaskExclusion
      tags: [areas]
      summary: Re-enable a previously excluded task for an area
      parameters:
        - name: areaId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveAreaTaskExclusionRequest"
      responses:
        "200":
          description: Exclusion removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List all tasks with optional filters
      parameters:
        - name: areaId
          in: query
          schema:
            type: integer
        - name: date
          in: query
          schema:
            type: string
        - name: assignedToId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"

  /tasks/special:
    get:
      operationId: listSpecialTasks
      tags: [tasks]
      summary: List special-request tasks for a date and optional area
      parameters:
        - name: date
          in: query
          schema:
            type: string
        - name: areaId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of special-request tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpecialTask"
    post:
      operationId: createSpecialTask
      tags: [tasks]
      summary: Create a special-request task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSpecialTaskRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialTask"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}/complete:
    post:
      operationId: completeTask
      tags: [tasks]
      summary: Mark a task as complete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteTaskRequest"
      responses:
        "200":
          description: Task completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}/uncomplete:
    post:
      operationId: uncompleteTask
      tags: [tasks]
      summary: Mark a task as incomplete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task uncompleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/complete-all:
    post:
      operationId: completeAllTasks
      tags: [tasks]
      summary: Complete all tasks for an area on a date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteAllTasksRequest"
      responses:
        "200":
          description: All tasks completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCompleteResponse"

  /assignments:
    get:
      operationId: listAssignments
      tags: [assignments]
      summary: List assignments
      parameters:
        - name: date
          in: query
          schema:
            type: string
        - name: staffId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assignment"
    post:
      operationId: createAssignment
      tags: [assignments]
      summary: Create a task assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssignmentRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"

  /assignments/{id}:
    delete:
      operationId: deleteAssignment
      tags: [assignments]
      summary: Delete an assignment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  /issues:
    get:
      operationId: listIssues
      tags: [issues]
      summary: List all issues
      parameters:
        - name: date
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
          description: Start date for range filter (YYYY-MM-DD)
        - name: to
          in: query
          schema:
            type: string
          description: End date for range filter (YYYY-MM-DD)
        - name: areaId
          in: query
          schema:
            type: integer
        - name: assignedToId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of issues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Issue"
    post:
      operationId: createIssue
      tags: [issues]
      summary: Report an issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIssueRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"

  /issues/{id}/resolve:
    post:
      operationId: resolveIssue
      tags: [issues]
      summary: Resolve an issue
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"

  /issues/{id}/images:
    patch:
      operationId: updateIssueImages
      tags: [issues]
      summary: Attach before/after image paths to an issue
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIssueImagesRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"

  /issues/{id}/assign:
    patch:
      operationId: assignIssue
      tags: [issues]
      summary: Assign an issue to a staff member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignIssueRequest"
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"

  /issues/{id}/complete:
    patch:
      operationId: completeIssue
      tags: [issues]
      summary: Mark an issue complete with notes (staff)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteIssueRequest"
      responses:
        "200":
          description: Completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"

  /task-types:
    get:
      operationId: listTaskTypes
      tags: [taskTypes]
      summary: List all task type templates
      responses:
        "200":
          description: List of task types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskType"
    post:
      operationId: createTaskType
      tags: [taskTypes]
      summary: Create a new task type template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskTypeRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskType"

  /task-types/{id}:
    put:
      operationId: updateTaskType
      tags: [taskTypes]
      summary: Update a task type template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskTypeRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskType"
    delete:
      operationId: deleteTaskType
      tags: [taskTypes]
      summary: Delete a task type template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  /task-types/reorder:
    post:
      operationId: reorderTaskTypes
      tags: [taskTypes]
      summary: Reorder task type templates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderTaskTypesRequest"
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCompleteResponse"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for a staff member
      parameters:
        - name: staffId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /notifications/mark-all-read:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications read for a staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkAllReadRequest"
      responses:
        "200":
          description: All marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCompleteResponse"

  /conversations:
    get:
      operationId: listConversations
      tags: [messages]
      summary: List conversations for a staff member
      parameters:
        - name: staffId
          in: query
          required: true
          schema:
            type: integer
        - name: archived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationSummary"
    post:
      operationId: startConversation
      tags: [messages]
      summary: Start (or fetch) a conversation with an allowed recipient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationStartInput"
      responses:
        "200":
          description: Existing or newly created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSummary"

  /conversations/inspector-channel:
    post:
      operationId: startInspectorConversation
      tags: [messages]
      summary: Open the dedicated inspector@marvolenterprises.com conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InspectorConversationStartInput"
      responses:
        "200":
          description: Dedicated inspector conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSummary"
        "503":
          description: Inspector email channel is unavailable

  /conversations/{id}/archive:
    patch:
      operationId: setConversationArchived
      tags: [messages]
      summary: Archive or restore a conversation for the authenticated staff member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationArchiveInput"
      responses:
        "200":
          description: Per-user archive state updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationArchiveResult"

  /conversations/{id}/messages:
    get:
      operationId: listConversationMessages
      tags: [messages]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: staffId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Messages, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
    post:
      operationId: sendConversationMessage
      tags: [messages]
      summary: Send a message in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "200":
          description: Existing message returned for an exact idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "201":
          description: Sent message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "409":
          description: The client request id was already used for a different message

  /conversations/{id}/messages/{msgId}/assign-special:
    post:
      operationId: assignInspectorMessage
      tags: [messages]
      summary: Triage an authenticated inspector email into an urgent special assignment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: msgId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignInspectorMessageInput"
      responses:
        "200":
          description: The source message was already assigned; existing task returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectorMessageAssignment"
        "201":
          description: Urgent special assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectorMessageAssignment"
        "409":
          description: No eligible active staff member is assigned to the selected area/date

  /conversations/{id}/read:
    post:
      operationId: markConversationRead
      tags: [messages]
      summary: Mark all messages in a conversation as read for a staff member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkAllReadRequest"
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCompleteResponse"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a short-lived verified URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Signed application upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /dashboard:
    get:
      operationId: getDashboard
      tags: [tasks]
      summary: Get dashboard statistics
      parameters:
        - name: date
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /applications:
    get:
      operationId: listApplications
      tags: [employment]
      summary: List job applications (admin/supervisor)
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobApplication"
    post:
      operationId: submitApplication
      tags: [employment]
      summary: Submit a public job application (unauthenticated)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitApplicationRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobApplication"

  /applications/{id}:
    get:
      operationId: getApplication
      tags: [employment]
      summary: Get a single application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Application detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobApplication"
    patch:
      operationId: updateApplication
      tags: [employment]
      summary: Update application status and employer-side fields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApplicationRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobApplication"

  /onboarding:
    get:
      operationId: listOnboardingHires
      tags: [employment]
      summary: List onboarding hires with progress
      responses:
        "200":
          description: List of hires
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OnboardingHire"
    post:
      operationId: createOnboardingHire
      tags: [employment]
      summary: Create an onboarding checklist for a new hire
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOnboardingHireRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingHire"

  /onboarding/{id}:
    get:
      operationId: getOnboardingHire
      tags: [employment]
      summary: Get an onboarding hire with its checklist items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Hire detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingHire"
    delete:
      operationId: deleteOnboardingHire
      tags: [employment]
      summary: Delete an onboarding hire
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  /onboarding/{id}/items:
    post:
      operationId: createOnboardingItem
      tags: [employment]
      summary: Add a checklist item to a hire
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOnboardingItemRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingItem"

  /onboarding/items/{itemId}:
    patch:
      operationId: updateOnboardingItem
      tags: [employment]
      summary: Update a checklist item (completion or content)
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOnboardingItemRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingItem"
    delete:
      operationId: deleteOnboardingItem
      tags: [employment]
      summary: Delete a checklist item
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  /quickbooks/status:
    get:
      operationId: getQuickbooksStatus
      tags: [employment]
      summary: Get QuickBooks connection status
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickbooksStatus"

  /quickbooks/connect:
    get:
      operationId: getQuickbooksConnectUrl
      tags: [employment]
      summary: Get the Intuit OAuth authorize URL
      responses:
        "200":
          description: Authorize URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickbooksConnectUrl"
        "409":
          description: Not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /quickbooks/disconnect:
    post:
      operationId: disconnectQuickbooks
      tags: [employment]
      summary: Disconnect the QuickBooks account
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickbooksStatus"

components:
