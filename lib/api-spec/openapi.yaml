openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Marvol Facility Cleaning Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: staff
    description: Staff management
  - name: authDiagnostics
    description: Authentication availability diagnostics and access audit history
  - name: areas
    description: Cleaning areas
  - name: tasks
    description: Task management
  - name: assignments
    description: Task assignments
  - name: issues
    description: Issue reporting
  - name: notifications
    description: In-app notifications
  - name: messages
    description: Direct messaging between roles
  - name: taskTypes
    description: Task type templates
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: operations
    description: Manager-only Petty Cash and Uniform Stock operations.

paths:
  /confidential-access/status:
    $ref: "./confidential-access.yaml#/status"
  /confidential-access/configure:
    $ref: "./confidential-access.yaml#/configure"
  /confidential-access/unlock:
    $ref: "./confidential-access.yaml#/unlock"
  /confidential-access/lock:
    $ref: "./confidential-access.yaml#/lock"
  /operations/confidential-access/status:
    $ref: "./confidential-access.yaml#/operationsStatus"
  /operations/confidential-access/unlock:
    $ref: "./confidential-access.yaml#/operationsUnlock"
  /operations/confidential-access/lock:
    $ref: "./confidential-access.yaml#/operationsLock"
  /staff/confidential:
    get:
      operationId: listConfidentialStaff
      tags: [Staff]
      summary: Personal contact information for code-unlocked administrators only
      responses:
        "200":
          description: Active staff including email and phone; never cached
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
        "423":
          description: Administrator access code required
        "403":
          description: Administrator role required
  /staff/presence:
    get:
      operationId: getStaffPresence
      tags: [staff]
      summary: Read staff app activity for administrators only
      description: Returns only staff ids and last-active timestamps. No sessions, tokens, GPS, page history, IP addresses, or confidential records are exposed.
      responses:
        "200":
          description: Current activity for active staff; activeNow uses a two-minute server-side window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffPresenceResponse"
        "401": { description: Verified staff sign-in required }
        "403": { description: Administrator role required }
  /staff/presence/activity:
    post:
      operationId: postStaffPresenceActivity
      tags: [staff]
      summary: Record the authenticated staff member's recent app activity
      description: Staff identity and timestamp are derived on the server. Client-supplied identity or timestamps are ignored; writes are limited to one per staff member per 30 seconds.
      responses:
        "204": { description: Activity accepted or safely rate-limited }
        "401": { description: Verified staff sign-in required }
        "403": { description: "Account is inactive, former, or login-disabled" }
  /identity-documents/context:
    $ref: "./identity-documents.yaml#/context"
  /identity-documents:
    $ref: "./identity-documents.yaml#/list"
  /identity-documents/hires/{hireId}/employee:
    $ref: "./identity-documents.yaml#/link"
  /identity-documents/uploads:
    $ref: "./identity-documents.yaml#/reserve"
  /identity-documents/uploads/{id}/complete:
    $ref: "./identity-documents.yaml#/complete"
  /identity-documents/uploads/{id}:
    $ref: "./identity-documents.yaml#/cancel"
  /identity-documents/{id}/image:
    $ref: "./identity-documents.yaml#/image"
  /identity-documents/{id}/review:
    $ref: "./identity-documents.yaml#/review"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /staff:
    get:
      operationId: listStaff
      tags: [staff]
      summary: List all staff members
      responses:
        "200":
          description: List of staff
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
    post:
      operationId: createStaffMember
      tags: [staff]
      summary: Create a staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffMemberRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"

  /staff/me:
    get:
      operationId: getCurrentStaffMember
      tags: [staff]
      summary: Resolve the authenticated session to a staff member
      responses:
        "200":
          description: Authenticated staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "401":
          description: The login session has expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionExpiredError"
        "403":
          description: Staff access is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAccessDisabledError"
        "404":
          description: No staff record matches the authenticated identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoStaffMatchError"
        "503":
          description: The authentication service is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthServiceUnavailableError"

  /staff/former:
    get:
      operationId: listFormerStaff
      tags: [staff]
      summary: List archived former staff for administrator rehire
      responses:
        "200":
          description: Former staff records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"

  /staff/{id}/rehire:
    post:
      operationId: rehireStaffMember
      tags: [staff]
      summary: Reactivate a former staff member without enabling sign-in
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reactivated staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"

  /staff/{id}:
    put:
      operationId: updateStaffMember
      tags: [staff]
      summary: Update a staff member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStaffMemberRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
    delete:
      operationId: deleteStaffMember
      tags: [staff]
      summary: Delete a staff member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  /areas:
    get:
      operationId: listAreas
      tags: [areas]
      summary: List all cleaning areas
      responses:
        "200":
          description: List of areas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CleaningArea"

  /areas/{areaId}/effective-tasks:
    get:
      operationId: listAreaEffectiveTasks
      tags: [areas]
      summary: List the effective task list for an area with included/excluded state
      parameters:
        - name: areaId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Effective tasks for the area
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AreaEffectiveTask"

  /areas/{areaId}/exclusions:
    post:
      operationId: addAreaTaskExclusion
      tags: [areas]
      summary: Mark a task as not applicable for an area
      parameters:
        - name: areaId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAreaTaskExclusionRequest"
      responses:
        "201":
          description: Exclusion recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  /areas/{areaId}/exclusions/remove:
    post:
      operationId: removeAreaTaskExclusion
      tags: [areas]
      summary: Re-enable a previously excluded task for an area
      parameters:
        - name: areaId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveAreaTaskExclusionRequest"
      responses:
        "200":
          description: Exclusion removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List all tasks with optional filters
      parameters:
        - name: areaId
          in: query
          schema:
            type: integer
        - name: date
          in: query
          schema:
            type: string
        - name: assignedToId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"

  /tasks/special:
    get:
      operationId: listSpecialTasks
      tags: [tasks]
      summary: List special-request tasks for a date and optional area
      parameters:
        - name: date
          in: query
          schema:
            type: string
        - name: areaId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of special-request tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpecialTask"
    post:
      operationId: createSpecialTask
      tags: [tasks]
      summary: Create a special-request task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSpecialTaskRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialTask"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}/complete:
    post:
      operationId: completeTask
      tags: [tasks]
      summary: Mark a task as complete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteTaskRequest"
      responses:
        "200":
          description: Task completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}/uncomplete:
    post:
      operationId: uncompleteTask
      tags: [tasks]
      summary: Mark a task as incomplete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task uncompleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/complete-all:
    post:
      operationId: completeAllTasks
      tags: [tasks]
      summary: Complete all tasks for an area on a date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteAllTasksRequest"
      responses:
        "200":
          description: All tasks completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCompleteResponse"

  /assignments:
    get:
      operationId: listAssignments
      tags: [assignments]
      summary: List assignments
      parameters:
        - name: date
          in: query
          schema:
            type: string
        - name: staffId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assignment"
    post:
      operationId: createAssignment
      tags: [assignments]
      summary: Create a task assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssignmentRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"

  /assignments/group:
    post:
      operationId: assignTerminalGroup
      tags: [assignments]
      summary: Assign one active staff member to every area in a terminal group for a date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalGroupAssignmentInput"
      responses:
        "201":
          description: The group was assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalGroupAssignmentResult"
        "409":
          description: Some areas in the group already belong to another staff member

  /assignments/group/reassign:
    post:
      operationId: reassignTerminalGroup
      tags: [assignments]
      summary: Confirmed date-only reassignment of a terminal group; tasks and recurring schedules are unchanged
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalGroupReassignmentInput"
      responses:
        "200":
          description: Group reassigned for the selected date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalGroupAssignmentResult"
        "409":
          description: Assignments changed since confirmation; refresh before retrying

  /schedules/group/preview:
    get:
      operationId: previewTerminalGroupScheduleMove
      tags: [schedules]
      summary: Review recurring schedule rows that would move to another staff member
      parameters:
        - { name: groupKey, in: query, required: true, schema: { $ref: "#/components/schemas/TerminalGroupKey" } }
        - { name: staffId, in: query, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Current recurring schedules for active areas in the group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalGroupSchedulePreview"
        "400": { description: Invalid group or ineligible target staff }
    post:
      operationId: moveTerminalGroupSchedule
      tags: [schedules]
      summary: Move reviewed recurring schedules only; dated assignments and tasks remain unchanged
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalGroupScheduleMoveInput"
      responses:
        "200":
          description: Recurring schedule rows moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalGroupScheduleMoveResult"
        "409": { description: Schedule changed since review or target schedule conflicts }

  /assignments/{id}:
    delete:
      operationId: deleteAssignment
      tags: [assignments]
      summary: Delete an assignment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  /issues:
    get:
      operationId: listIssues
      tags: [issues]
      summary: List all issues
      parameters:
        - name: date
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
          description: Start date for range filter (YYYY-MM-DD)
        - name: to
          in: query
          schema:
            type: string
          description: End date for range filter (YYYY-MM-DD)
        - name: areaId
          in: query
          schema:
            type: integer
        - name: assignedToId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of issues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Issue"
    post:
      operationId: createIssue
      tags: [issues]
      summary: Report an issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIssueRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"

  /issues/{id}/resolve:
    post:
      operationId: resolveIssue
      tags: [issues]
      summary: Resolve an issue
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"

  /issues/{id}/images:
    patch:
      operationId: updateIssueImages
      tags: [issues]
      summary: Attach before/after image paths to an issue
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIssueImagesRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"

  /issues/{id}/assign:
    patch:
      operationId: assignIssue
      tags: [issues]
      summary: Assign an issue to a staff member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignIssueRequest"
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"

  /issues/{id}/complete:
    patch:
      operationId: completeIssue
      tags: [issues]
      summary: Mark an issue complete with notes (staff)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteIssueRequest"
      responses:
        "200":
          description: Completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"

  /task-types:
    get:
      operationId: listTaskTypes
      tags: [taskTypes]
      summary: List all task type templates
      responses:
        "200":
          description: List of task types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskType"
    post:
      operationId: createTaskType
      tags: [taskTypes]
      summary: Create a new task type template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskTypeRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskType"

  /task-types/{id}:
    put:
      operationId: updateTaskType
      tags: [taskTypes]
      summary: Update a task type template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskTypeRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskType"
    delete:
      operationId: deleteTaskType
      tags: [taskTypes]
      summary: Delete a task type template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  /task-types/reorder:
    post:
      operationId: reorderTaskTypes
      tags: [taskTypes]
      summary: Reorder task type templates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderTaskTypesRequest"
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCompleteResponse"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for a staff member
      parameters:
        - name: staffId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /notifications/mark-all-read:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications read for a staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkAllReadRequest"
      responses:
        "200":
          description: All marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCompleteResponse"

  /conversations:
    get:
      operationId: listConversations
      tags: [messages]
      summary: List conversations for a staff member
      parameters:
        - name: staffId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationSummary"
    post:
      operationId: startConversation
      tags: [messages]
      summary: Start (or fetch) a conversation with an allowed recipient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationStartInput"
      responses:
        "200":
          description: Existing or newly created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSummary"

  /inspector-email/recipients:
    get:
      operationId: listInspectorEmailRecipients
      tags: [messages]
      summary: List approved external inspector email recipients for management
      responses:
        "200":
          description: Shared inspector identity and approved recipient addresses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectorEmailRecipientsResponse"
        "401":
          description: Login session required
        "403":
          description: Admin or supervisor access required

  /conversations/{id}/messages:
    get:
      operationId: listConversationMessages
      tags: [messages]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: staffId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Messages, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
    post:
      operationId: sendConversationMessage
      tags: [messages]
      summary: Send a message in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "201":
          description: Sent message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"

  /conversations/{id}/messages/{msgId}/receipt:
    post:
      operationId: confirmConversationMessageReceipt
      tags: [messages]
      summary: Record an authenticated in-app receipt acknowledgment for an inspector email message
      description: Actor identity comes from the verified session. The request accepts no staff identifier and never sends email.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: msgId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: This message version already has a receipt acknowledgment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageReceiptConfirmationResponse"
        "201":
          description: Receipt acknowledgment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageReceiptConfirmationResponse"
        "401":
