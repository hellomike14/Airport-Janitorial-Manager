      responses:
        "202":
          description: The configured email provider accepted the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedEmailResponse"
        "400": { description: "Invalid id, document index, or recipient address" }
        "403": { description: Administrator and confidential access required }
        "404": { description: Application or document not found }
        "413": { description: PDF exceeds the supported attachment limit }
        "415": { description: The selected upload is not a PDF }
        "502": { description: Email provider rejected the message }
        "503": { description: Email delivery is not configured or the stored document is unavailable }

