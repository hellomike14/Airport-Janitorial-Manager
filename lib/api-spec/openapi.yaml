        "400": { description: Invalid recipient address }
        "401": { description: Authenticated staff session required }
        "403": { description: Authorized staff role required }
        "413": { description: The onboarding protocol exceeds the email attachment limit }
        "502": { description: Email provider rejected the message }
        "503": { description: Email delivery is not configured or the protected PDF is unavailable }

