openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Marvol Facility Cleaning Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: staff
    description: Staff management
  - name: authDiagnostics
    description: Authentication availability diagnostics and access audit history
  - name: areas
    description: Cleaning areas
  - name: tasks
    description: Task management
  - name: assignments
    description: Task assignments
  - name: issues
    description: Issue reporting
  - name: notifications
    description: In-app notifications
  - name: messages
    description: Direct messaging between roles
  - name: taskTypes
    description: Task type templates
  - name: Storage
    description: Object storage upload and serving endpoints.

paths:
  /confidential-access/status:
    $ref: "./confidential-access.yaml#/status"
  /confidential-access/configure:
    $ref: "./confidential-access.yaml#/configure"
  /confidential-access/unlock:
    $ref: "./confidential-access.yaml#/unlock"
  /confidential-access/lock:
    $ref: "./confidential-access.yaml#/lock"
  /staff/confidential:
    get:
      operationId: listConfidentialStaff
      tags: [Staff]
      summary: Personal contact information for code-unlocked administrators only
      responses:
        "200":
          description: Active staff including email and phone; never cached
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
        "423":
          description: Administrator access code required
        "403":
          description: Administrator role required
  /identity-documents/context:
    $ref: "./identity-documents.yaml#/context"
  /identity-documents:
    $ref: "./identity-documents.yaml#/list"
  /identity-documents/hires/{hireId}/employee:
    $ref: "./identity-documents.yaml#/link"
  /identity-documents/uploads:
    $ref: "./identity-documents.yaml#/reserve"
  /identity-documents/uploads/{id}/complete:
    $ref: "./identity-documents.yaml#/complete"
  /identity-documents/uploads/{id}:
    $ref: "./identity-documents.yaml#/cancel"
  /identity-documents/{id}/image:
    $ref: "./identity-documents.yaml#/image"
  /identity-documents/{id}/review:
    $ref: "./identity-documents.yaml#/review"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /staff:
    get:
      operationId: listStaff
      tags: [staff]
      summary: List all staff members
      responses:
        "200":
          description: List of staff
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
    post:
      operationId: createStaffMember
      tags: [staff]
      summary: Create a staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffMemberRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"

  /staff/me:
    get:
      operationId: getCurrentStaffMember
      tags: [staff]
      summary: Resolve the authenticated session to a staff member
      responses:
        "200":
          description: Authenticated staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "401":
          description: The login session has expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionExpiredError"
        "403":
          description: Staff access is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAccessDisabledError"
        "404":
          description: No staff record matches the authenticated identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoStaffMatchError"
        "503":
          description: The authentication service is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthServiceUnavailableError"

  /staff/former:
    get:
      operationId: listFormerStaff
      tags: [staff]
      summary: List archived former staff for administrator rehire
      responses:
        "200":
          description: Former staff records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"

  /staff/{id}/rehire:
    post:
      operationId: rehireStaffMember
      tags: [staff]
      summary: Reactivate a former staff member without enabling sign-in
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reactivated staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"

  /staff/{id}:
    put:
      operationId: updateStaffMember
      tags: [staff]
      summary: Update a staff member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStaffMemberRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
    delete:
      operationId: deleteStaffMember
      tags: [staff]
      summary: Delete a staff member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  /areas:
    get:
      operationId: listAreas
      tags: [areas]
      summary: List all cleaning areas
      responses:
        "200":
          description: List of areas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CleaningArea"

  /areas/{areaId}/effective-tasks:
    get:
      operationId: listAreaEffectiveTasks
      tags: [areas]
      summary: List the effective task list for an area with included/excluded state
      parameters:
        - name: areaId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Effective tasks for the area
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AreaEffectiveTask"

  /areas/{areaId}/exclusions:
    post:
      operationId: addAreaTaskExclusion
      tags: [areas]
      summary: Mark a task as not applicable for an area
      parameters:
        - name: areaId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAreaTaskExclusionRequest"
      responses:
        "201":
          description: Exclusion recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  /areas/{areaId}/exclusions/remove:
    post:
      operationId: removeAreaTaskExclusion
      tags: [areas]
      summary: Re-enable a previously excluded task for an area
      parameters:
        - name: areaId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveAreaTaskExclusionRequest"
      responses:
        "200":
          description: Exclusion removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List all tasks with optional filters
      parameters:
        - name: areaId
          in: query
          schema:
            type: integer
        - name: date
          in: query
          schema:
            type: string
        - name: assignedToId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"

  /tasks/special:
    get:
      operationId: listSpecialTasks
      tags: [tasks]
      summary: List special-request tasks for a date and optional area
      parameters:
        - name: date
          in: query
          schema:
            type: string
        - name: areaId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of special-request tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpecialTask"
    post:
      operationId: createSpecialTask
      tags: [tasks]
      summary: Create a special-request task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSpecialTaskRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialTask"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tasks/{id}/complete:
    post:
      operationId: completeTask
      tags: [tasks]
      summary: Mark a task as complete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteTaskRequest"
      responses:
        "200":
          description: Task completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}/uncomplete:
    post:
      operationId: uncompleteTask
      tags: [tasks]
      summary: Mark a task as incomplete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task uncompleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/complete-all:
    post:
      operationId: completeAllTasks
      tags: [tasks]
      summary: Complete all tasks for an area on a date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteAllTasksRequest"
      responses:
        "200":
          description: All tasks completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCompleteResponse"

  /assignments:
    get:
      operationId: listAssignments
      tags: [assignments]
      summary: List assignments
      parameters:
        - name: date
          in: query
          schema:
            type: string
        - name: staffId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assignment"
    post:
      operationId: createAssignment
      tags: [assignments]
      summary: Create a task assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssignmentRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"

  /assignments/group:
    post:
      operationId: assignTerminalGroup
      tags: [assignments]
      summary: Assign one active staff member to every area in a terminal group for a date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalGroupAssignmentInput"
      responses:
        "201":
          description: The group was assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalGroupAssignmentResult"
        "409":
          description: Some areas in the group already belong to another staff member

  /assignments/group/reassign:
    post:
      operationId: reassignTerminalGroup
      tags: [assignments]
      summary: Confirmed date-only reassignment of a terminal group; tasks and recurring schedules are unchanged
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalGroupReassignmentInput"
      responses:
        "200":
          description: Group reassigned for the selected date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalGroupAssignmentResult"
        "409":
          description: Assignments changed since confirmation; refresh before retrying

  /schedules/group/preview:
    get:
      operationId: previewTerminalGroupScheduleMove
      tags: [schedules]
      summary: Review recurring schedule rows that would move to another staff member
      parameters:
        - { name: groupKey, in: query, required: true, schema: { $ref: "#/components/schemas/TerminalGroupKey" } }
        - { name: staffId, in: query, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Current recurring schedules for active areas in the group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalGroupSchedulePreview"
        "400": { description: Invalid group or ineligible target staff }
    post:
      operationId: moveTerminalGroupSchedule
      tags: [schedules]
      summary: Move reviewed recurring schedules only; dated assignments and tasks remain unchanged
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalGroupScheduleMoveInput"
      responses:
        "200":
          description: Recurring schedule rows moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalGroupScheduleMoveResult"
        "409": { description: Schedule changed since review or target schedule conflicts }

  /assignments/{id}:
    delete:
      operationId: deleteAssignment
      tags: [assignments]
      summary: Delete an assignment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  /issues:
    get:
      operationId: listIssues
      tags: [issues]
      summary: List all issues
      parameters:
        - name: date
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
          description: Start date for range filter (YYYY-MM-DD)
        - name: to
          in: query
          schema:
            type: string
          description: End date for range filter (YYYY-MM-DD)
        - name: areaId
          in: query
          schema:
            type: integer
        - name: assignedToId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of issues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Issue"
    post:
      operationId: createIssue
      tags: [issues]
      summary: Report an issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIssueRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"

  /issues/{id}/resolve:
    post:
      operationId: resolveIssue
      tags: [issues]
      summary: Resolve an issue
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"

  /issues/{id}/images:
    patch:
      operationId: updateIssueImages
      tags: [issues]
      summary: Attach before/after image paths to an issue
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIssueImagesRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"

  /issues/{id}/assign:
    patch:
      operationId: assignIssue
      tags: [issues]
      summary: Assign an issue to a staff member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignIssueRequest"
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"

  /issues/{id}/complete:
    patch:
      operationId: completeIssue
      tags: [issues]
      summary: Mark an issue complete with notes (staff)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteIssueRequest"
      responses:
        "200":
          description: Completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"

  /task-types:
    get:
      operationId: listTaskTypes
      tags: [taskTypes]
      summary: List all task type templates
      responses:
        "200":
          description: List of task types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskType"
    post:
      operationId: createTaskType
      tags: [taskTypes]
      summary: Create a new task type template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskTypeRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskType"

  /task-types/{id}:
    put:
      operationId: updateTaskType
      tags: [taskTypes]
      summary: Update a task type template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskTypeRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskType"
    delete:
      operationId: deleteTaskType
      tags: [taskTypes]
      summary: Delete a task type template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  /task-types/reorder:
    post:
      operationId: reorderTaskTypes
      tags: [taskTypes]
      summary: Reorder task type templates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderTaskTypesRequest"
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCompleteResponse"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for a staff member
      parameters:
        - name: staffId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /notifications/mark-all-read:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications read for a staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkAllReadRequest"
      responses:
        "200":
          description: All marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCompleteResponse"

  /conversations:
    get:
      operationId: listConversations
      tags: [messages]
      summary: List conversations for a staff member
      parameters:
        - name: staffId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationSummary"
    post:
      operationId: startConversation
      tags: [messages]
      summary: Start (or fetch) a conversation with an allowed recipient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationStartInput"
      responses:
        "200":
          description: Existing or newly created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSummary"

  /inspector-email/recipients:
    get:
      operationId: listInspectorEmailRecipients
      tags: [messages]
      summary: List approved external inspector email recipients for management
      responses:
        "200":
          description: Shared inspector identity and approved recipient addresses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectorEmailRecipientsResponse"
        "401":
          description: Login session required
        "403":
          description: Admin or supervisor access required

  /conversations/{id}/messages:
    get:
      operationId: listConversationMessages
      tags: [messages]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: staffId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Messages, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
    post:
      operationId: sendConversationMessage
      tags: [messages]
      summary: Send a message in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "201":
          description: Sent message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"

  /conversations/{id}/old-messages:
    delete:
      operationId: deleteOldConversationMessages
      tags: [messages]
      summary: Permanently remove messages before a date from one conversation
      description: Admin only. Messages linked to inspector tasks or awaiting email delivery are retained.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: before
          in: query
          required: true
          description: Exclusive cutoff as an ISO date-time with timezone.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Number of deleted and protected messages
          content:
            application/json:
              schema:
                type: object
                required: [deleted, retained]
                properties:
                  deleted: { type: integer }
                  retained: { type: integer }

  /conversations/{id}/read:
    post:
      operationId: markConversationRead
      tags: [messages]
      summary: Mark all messages in a conversation as read for a staff member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkAllReadRequest"
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCompleteResponse"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /dashboard:
    get:
      operationId: getDashboard
      tags: [tasks]
      summary: Get dashboard statistics
      parameters:
        - name: date
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /applications:
    get:
      operationId: listApplications
      tags: [employment]
      summary: List confidential submissions; requires verified Admin and confidential code
      description: Completed answers and attachments are never available to supervisors or applicants.
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobApplication"
    post:
      operationId: submitApplication
      tags: [employment]
      summary: Publicly submit completed job application, employee I-9 and W-4
      description: Stores completed records privately. Returns only a success receipt, never form answers or file paths.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitApplicationRequest"
      responses:
        "201":
          description: Minimal receipt; completed answers, signatures and attachment paths are withheld
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationSubmissionReceipt"
        "400":
          description: Invalid application or uploaded-file capability

  /applications/{id}:
    get:
      operationId: getApplication
      tags: [employment]
      summary: Get a confidential application (verified Admin plus access code only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Application detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobApplication"
    patch:
      operationId: updateApplication
      tags: [employment]
      summary: Update an application and employer-side fields (verified Admin plus access code only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApplicationRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobApplication"

  /onboarding:
    get:
      operationId: listOnboardingHires
      tags: [employment]
      summary: List onboarding hires with progress
      responses:
        "200":
          description: List of hires
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OnboardingHire"
    post:
      operationId: createOnboardingHire
      tags: [employment]
      summary: Create an onboarding checklist for a new hire
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOnboardingHireRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingHire"

  /onboarding/{id}:
    get:
      operationId: getOnboardingHire
      tags: [employment]
      summary: Get an onboarding hire with its checklist items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Hire detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingHire"
    delete:
      operationId: deleteOnboardingHire
      tags: [employment]
      summary: Delete an onboarding hire
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  /onboarding/{id}/items:
    post:
      operationId: createOnboardingItem
      tags: [employment]
      summary: Add a checklist item to a hire
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOnboardingItemRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingItem"

  /onboarding/items/{itemId}:
    patch:
      operationId: updateOnboardingItem
      tags: [employment]
      summary: Update a checklist item (completion or content)
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOnboardingItemRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingItem"
    delete:
      operationId: deleteOnboardingItem
      tags: [employment]
      summary: Delete a checklist item
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  /quickbooks/status:
    get:
      operationId: getQuickbooksStatus
      tags: [employment]
      summary: Get QuickBooks connection status
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickbooksStatus"

  /quickbooks/connect:
    get:
      operationId: getQuickbooksConnectUrl
      tags: [employment]
      summary: Get the Intuit OAuth authorize URL
      responses:
        "200":
          description: Authorize URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickbooksConnectUrl"
        "409":
          description: Not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /quickbooks/disconnect:
    post:
      operationId: disconnectQuickbooks
      tags: [employment]
      summary: Disconnect the QuickBooks account
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickbooksStatus"

  /conversations/{id}/archive:
    patch:
      operationId: setConversationArchive
      tags: [messages]
      summary: Archive or restore a conversation for the authenticated participant
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetConversationArchiveRequest"
      responses:
        "200":
          description: Archive state changed
          content:
            application/json:
              schema:
                type: object
                required: [archived]
                properties:
                  archived: { type: boolean }

  /webhooks/sendgrid/inbound:
    post:
      operationId: receiveSendgridInspectorReply
      tags: [messages]
      summary: Accept an authenticated inspector email reply
      security:
        - SendGridInboundSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendgridInboundReplyRequest"
      responses:
        "200": { description: Reply accepted or idempotently replayed }
        "401": { description: Invalid webhook credential }
        "403": { description: "Invalid sender, token, authentication, or conversation" }

  /inspector-workflow/{taskId}:
    get:
      operationId: getInspectorWorkflow
      tags: [messages]
      summary: Get authorized inspector assignment workflow state and audit history
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Inspector assignment state for an authorized actor
          content:
            application/json:
              schema:
                type: object
                required: [source, task, area, dueAt, remainingSeconds, status, history]
                properties:
                  source:
                    type: object
                    properties:
                      conversationId: { type: integer }
                      messageId: { type: integer }
                  task:
                    type: object
                    required: [id, name, completed, completedAt]
                    properties:
                      id: { type: integer }
                      name: { type: string }
                      completed: { type: boolean }
                      completedAt: { type: [string, 'null'], format: date-time }
                  area:
                    type: object
                    required: [id, name]
                    properties:
                      id: { type: integer }
                      name: { type: string }
                  assignedStaff:
                    type: [object, 'null']
                    required: [id, name]
                    properties:
                      id: { type: integer }
                      name: { type: string }
                  assignmentMethod: { type: string, enum: [fresh_gps, area_roster_workload] }
                  assignmentDistanceMeters: { type: [number, 'null'] }
                  dueAt: { type: string, format: date-time }
                  remainingSeconds: { type: integer, minimum: 0 }
                  status: { type: string, enum: [assigned, overdue, escalated, completed] }
                  escalatedAt: { type: [string, 'null'], format: date-time }
                  history:
                    type: array
                    items:
                      type: object
                      required: [assignedStaffId, assignedById, event, method, distanceMeters, provenance, createdAt]
                      properties:
                        assignedStaffId: { type: integer }
                        assignedById: { type: integer }
                        event: { type: string, enum: [assigned, reassigned] }
                        method: { type: string, enum: [fresh_gps, area_roster_workload] }
                        distanceMeters: { type: [number, 'null'] }
                        provenance: { type: string }
                        createdAt: { type: string, format: date-time }
                  completionEmailDeliveryStatus:
                    type: [string, 'null']
                    enum: [pending, sending, retrying, accepted, disabled, not_configured, failed, null]
        "401": { description: Login required }
        "403": { description: Not authorized for this workflow }
        "404": { description: Inspector workflow task not found }

  /internal/inspector-sla-sweep:
    post:
      operationId: runInspectorSlaSweep
      tags: [internal]
      summary: Internal scheduler trigger for overdue inspector assignments
      security:
        - InternalCronSecret: []
      responses:
        "202": { description: Idempotent sweep completed }
        "401": { description: Invalid scheduler credential }

  /auth-diagnostics/events:
    post:
      operationId: reportAuthDiagnosticEvent
      tags: [authDiagnostics]
      summary: Report a limited authentication availability diagnostic
      description: Accepts a limited set of diagnostic codes without requiring an authenticated session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthDiagnosticEventInput"
      responses:
        "201":
          description: Diagnostic event recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthDiagnosticEventReceipt"
        "400":
          description: Diagnostic code is not accepted from unauthenticated clients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidDiagnosticCodeError"
        "429":
          description: Too many diagnostic reports
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthDiagnosticRateLimitError"
        "503":
          description: The diagnostic event could not be persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticStoreUnavailableError"

  /auth-diagnostics:
    get:
      operationId: getAuthDiagnostics
      tags: [authDiagnostics]
      summary: Get authentication diagnostics and staff access audit history
      description: Available only to authenticated administrators.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Authentication diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthDiagnostics"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /employment-forms/job-application:
    get:
      operationId: getEmploymentJobApplication
      tags: [Employment]
      summary: Open or download the original fillable Marvol job application
      description: Public blank fillable template; exposes no submitted application data.
      parameters:
        - name: download
          in: query
          required: false
          schema:
            type: string
            enum: ["1"]
          description: Set to 1 to download instead of opening inline.
      responses:
        "200":
          description: Original fillable application PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid download option
        "404":
          description: Application PDF not found
        "503":
          description: Application PDF temporarily unavailable
  /employment-forms/i-9:
    get:
      operationId: getEmploymentI9Form
      tags: [Employment]
      summary: Open or download the original fillable I-9 PDF
      description: Public blank fillable template; exposes no submitted I-9 data.
      parameters:
        - name: download
          in: query
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: Original fillable I-9 PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid download option
        "404":
          description: Form not found
        "503":
          description: Form temporarily unavailable
  /employment-forms/w-4:
    get:
      operationId: getEmploymentW4Form
      tags: [Employment]
      summary: Open or download the original fillable 2026 W-4 PDF
      description: Public blank fillable template; exposes no submitted W-4 data.
      parameters:
        - name: download
          in: query
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: Original fillable W-4 PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid download option
        "404":
          description: Form not found
        "503":
          description: Form temporarily unavailable
  /employee-training/video:
    get:
      operationId: getEmployeeTrainingVideo
      summary: Private employee training video with HTTP byte ranges
      parameters:
        - in: header
          name: Range
          schema: { type: string }
      responses:
        "200":
          description: Full video
          content:
            video/mp4:
              schema: { type: string, format: binary }
        "206":
          description: Requested video byte range
          content:
            video/mp4:
              schema: { type: string, format: binary }
        "401": { description: Verified staff session required }
        "403": { description: Employee Portal access required }
        "416": { description: Invalid or unsatisfiable byte range }
  /employee-training/status:
    get:
      operationId: getEmployeeTrainingStatus
      summary: Current employee's progress and retained attestations
      responses:
        "200":
          description: Own training status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmployeeTrainingStatus" }
  /employee-training/session:
    post:
      operationId: startEmployeeTrainingSession
      summary: Start one watch session for the signed-in employee
      responses:
        "200":
          description: Watch session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingSession" }
  /employee-training/progress:
    post:
      operationId: updateEmployeeTrainingProgress
      summary: Record validated contiguous playback coverage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrainingHeartbeat" }
      responses:
        "200":
          description: Persisted watch coverage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingWatchStatus" }
        "409": { description: Superseded watch session }
  /employee-training/acknowledgment:
    post:
      operationId: acknowledgeEmployeeTraining
      summary: Save one immutable employee attestation per version
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrainingAttestationInput" }
      responses:
        "200":
          description: Saved employee attestation and history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmployeeTrainingStatus" }
        "400": { description: "Invalid confirmation, signature or version" }
        "409": { description: Full video not watched }
  /employee-training/review:
    get:
      operationId: getEmployeeTrainingReview
      summary: Manager-only current completion and historical employee attestations
      responses:
        "200":
          description: Manager review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingReview" }
        "403": { description: Manager access required }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    InternalCronSecret:
      type: apiKey
      in: header
      name: X-Internal-Cron-Secret
    SendGridInboundSecret:
      type: apiKey
      in: header
      name: X-SendGrid-Inbound-Secret
  schemas:
    TrainingVersion:
      type: object
      required: [version, title, duration, videoUrl]
      properties:
        version: { type: string }
        title: { type: string }
        duration: { type: number }
        videoUrl: { type: string }
    TrainingWatchStatus:
      type: object
      required: [watchedSeconds, eligible]
      properties:
        watchedSeconds: { type: number }
        eligible: { type: boolean }
    TrainingAcknowledgment:
      type: object
      required: [id, staffId, version, trainingTitle, videoSha256, signature, staffName, watchedConfirmation, understoodConfirmation, completedAt]
      properties:
        id: { type: integer }
        staffId: { type: integer }
        version: { type: string }
        trainingTitle: { type: string }
        videoSha256: { type: string }
        signature: { type: string }
        staffName: { type: string }
        watchedConfirmation: { type: boolean }
        understoodConfirmation: { type: boolean }
        completedAt: { type: string, format: date-time }
    EmployeeTrainingStatus:
      type: object
      required: [training, staff, watchedSeconds, eligible, acknowledgment, history]
      properties:
        training: { $ref: "#/components/schemas/TrainingVersion" }
        staff:
          type: object
          required: [id, name]
          properties:
            id: { type: integer }
            name: { type: string }
        watchedSeconds: { type: number }
        eligible: { type: boolean }
        acknowledgment:
          anyOf:
            - $ref: "#/components/schemas/TrainingAcknowledgment"
            - type: "null"
        history:
          type: array
          items: { $ref: "#/components/schemas/TrainingAcknowledgment" }
    TrainingSession:
      type: object
      required: [sessionId]
      properties:
        sessionId: { type: string, format: uuid }
    TrainingHeartbeat:
      type: object
      additionalProperties: false
      required: [sessionId, version, position, playing, seeking, rate]
      properties:
        sessionId: { type: string, format: uuid }
        version: { type: string }
        position: { type: number, minimum: 0 }
        playing: { type: boolean }
        seeking: { type: boolean }
        rate: { type: number, minimum: 0.25, maximum: 2 }
    TrainingAttestationInput:
      type: object
      additionalProperties: false
      required: [version, watched, understood, fullName]
      properties:
        version: { type: string }
        watched: { type: boolean, const: true }
        understood: { type: boolean, const: true }
        fullName: { type: string, minLength: 1, maxLength: 200 }
    TrainingEmployeeReview:
      type: object
      required: [staffId, name, active, formerEmployee, status, watchedSeconds, eligible, acknowledgment, history]
      properties:
        staffId: { type: integer }
        name: { type: string }
        active: { type: boolean }
        formerEmployee: { type: boolean }
        status: { type: string, enum: [pending, completed] }
        watchedSeconds: { type: number }
        eligible: { type: boolean }
        acknowledgment:
          anyOf:
            - $ref: "#/components/schemas/TrainingAcknowledgment"
            - type: "null"
        history:
          type: array
          items: { $ref: "#/components/schemas/TrainingAcknowledgment" }
    TrainingReview:
      type: object
      required: [training, employees]
      properties:
        training: { $ref: "#/components/schemas/TrainingVersion" }
        employees:
          type: array
          items: { $ref: "#/components/schemas/TrainingEmployeeReview" }
    SetConversationArchiveRequest:
      type: object
      required: [staffId, archived]
      properties:
        staffId: { type: integer }
        archived: { type: boolean }
    SendgridInboundReplyRequest:
      type: object
      required: [envelope, from, text]
      properties:
        envelope:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: email }
            to: { type: array, items: { type: string, format: email } }
        from: { type: string, format: email }
        text: { type: string, maxLength: 2000 }
        headers: { type: string }
        SPF: { type: string }
        dkim: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SessionExpiredError:
      type: object
      required: [error, diagnosticId]
      properties:
        error:
          type: string
          enum: [SESSION_EXPIRED]
        diagnosticId:
          type: string

    StaffAccessDisabledError:
      type: object
      required: [error, diagnosticId]
      properties:
        error:
          type: string
          enum: [STAFF_ACCESS_DISABLED]
        diagnosticId:
          type: string

    NoStaffMatchError:
      type: object
      required: [error, diagnosticId]
      properties:
        error:
          type: string
          enum: [NO_STAFF_MATCH]
        diagnosticId:
          type: string

    AuthServiceUnavailableError:
      type: object
      required: [error, diagnosticId]
      properties:
        error:
          type: string
          enum: [AUTH_SERVICE_UNAVAILABLE]
        diagnosticId:
          type: string

    AuthDiagnosticCode:
      type: string
      enum: [AUTH_SERVICE_UNAVAILABLE, STAFF_LOOKUP_TIMEOUT]

    AuthDiagnosticRecordedCode:
      type: string
      enum:
        - SESSION_EXPIRED
        - NO_STAFF_MATCH
        - STAFF_ACCESS_DISABLED
        - AUTH_SERVICE_UNAVAILABLE
        - STAFF_LOOKUP_TIMEOUT

    AuthDiagnosticEventInput:
      type: object
      required: [code]
      properties:
        code:
          $ref: "#/components/schemas/AuthDiagnosticCode"

    AuthDiagnosticEventReceipt:
      type: object
      required: [diagnosticId]
      properties:
        diagnosticId:
          type: string

    InvalidDiagnosticCodeError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [INVALID_DIAGNOSTIC_CODE]

    AuthDiagnosticRateLimitError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [RATE_LIMITED]

    DiagnosticStoreUnavailableError:
      type: object
      required: [error, diagnosticId]
      properties:
        error:
          type: string
          enum: [DIAGNOSTIC_STORE_UNAVAILABLE]
        diagnosticId:
          type: string

    AuthDiagnosticEvent:
      type: object
      required: [diagnosticId, code, source, createdAt]
      properties:
        diagnosticId:
          type: string
        code:
          $ref: "#/components/schemas/AuthDiagnosticRecordedCode"
        source:
          type: string
          enum: [server, client]
        createdAt:
          type: string
          format: date-time

    AuthDiagnosticSummary:
      type: object
      required: [code, count]
      properties:
        code:
          $ref: "#/components/schemas/AuthDiagnosticRecordedCode"
        count:
          type: integer
          minimum: 0

    StaffAccessState:
      type: object
      required: [active, loginEnabled, formerEmployee, hasEmail]
      properties:
        active:
          type: boolean
        loginEnabled:
          type: boolean
        formerEmployee:
          type: boolean
        hasEmail:
          type: boolean

    StaffAccessChange:
      type: object
      required: [id, actorName, staffName, action, createdAt, before, after]
      properties:
        id:
          type: integer
        actorName:
          type: string
        staffName:
          type: string
        action:
          type: string
          enum: [CREATE, UPDATE, DELETE]
        createdAt:
          type: string
          format: date-time
        before:
          $ref: "#/components/schemas/StaffAccessState"
        after:
          $ref: "#/components/schemas/StaffAccessState"

    AuthDiagnostics:
      type: object
      required: [events, summary, accessChanges]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/AuthDiagnosticEvent"
        summary:
          type: array
          items:
            $ref: "#/components/schemas/AuthDiagnosticSummary"
        accessChanges:
          type: array
          items:
