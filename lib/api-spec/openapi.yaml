  /applications/{id}/email-pdf:
    post:
      operationId: emailApplicationPdf
      tags: [employment]
      summary: Email a confidential application PDF (verified Admin plus access code only)
      description: The PDF is generated from the saved application record on the server; client-supplied files and URLs are not accepted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmploymentPdfEmailInput"
      responses:
        "202":
          description: The configured email provider accepted the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedEmailResponse"
        "400": { description: Invalid id or recipient address }
        "403": { description: Administrator and confidential access required }
        "404": { description: Application not found }
        "413": { description: PDF exceeds the supported attachment limit }
        "502": { description: Email provider rejected the message }
        "503": { description: Email delivery is not configured }

  /applications/{id}/documents/{documentIndex}/email:
    post:
      operationId: emailApplicationDocumentPdf
      tags: [employment]
      summary: Email one uploaded application PDF (verified Admin plus access code only)
      description: The document is selected from the saved application record by index; arbitrary paths, URLs, and attachments are not accepted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: documentIndex
          in: path
          required: true
