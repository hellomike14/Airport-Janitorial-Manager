openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Marvol Facility Cleaning Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: staff
    description: Staff management
  - name: areas
    description: Cleaning areas
  - name: tasks
    description: Task management
  - name: assignments
    description: Task assignments
  - name: issues
    description: Issue reporting
  - name: notifications
    description: In-app notifications
  - name: taskTypes
    description: Task type templates
  - name: Storage
    description: Object storage upload and serving endpoints.

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /staff:
    get:
      operationId: listStaff
      tags: [staff]
      summary: List all staff members
      responses:
        "200":
          description: List of staff
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
    post:
      operationId: createStaffMember
      tags: [staff]
      summary: Create a staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffMemberRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"

  /staff/{id}:
    put:
      operationId: updateStaffMember
      tags: [staff]
      summary: Update a staff member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStaffMemberRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
    delete:
      operationId: deleteStaffMember
      tags: [staff]
      summary: Delete a staff member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  /areas:
    get:
      operationId: listAreas
      tags: [areas]
      summary: List all cleaning areas
      responses:
        "200":
          description: List of areas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CleaningArea"

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List all tasks with optional filters
      parameters:
        - name: areaId
          in: query
          schema:
            type: integer
        - name: date
          in: query
          schema:
            type: string
        - name: assignedToId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"

  /tasks/{id}/complete:
    post:
      operationId: completeTask
      tags: [tasks]
      summary: Mark a task as complete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteTaskRequest"
      responses:
        "200":
          description: Task completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}/uncomplete:
    post:
      operationId: uncompleteTask
      tags: [tasks]
      summary: Mark a task as incomplete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task uncompleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/complete-all:
    post:
      operationId: completeAllTasks
      tags: [tasks]
      summary: Complete all tasks for an area on a date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteAllTasksRequest"
      responses:
        "200":
          description: All tasks completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCompleteResponse"

  /assignments:
    get:
      operationId: listAssignments
      tags: [assignments]
      summary: List assignments
      parameters:
        - name: date
          in: query
          schema:
            type: string
        - name: staffId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assignment"
    post:
      operationId: createAssignment
      tags: [assignments]
      summary: Create a task assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssignmentRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"

  /assignments/{id}:
    delete:
      operationId: deleteAssignment
      tags: [assignments]
      summary: Delete an assignment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  /issues:
    get:
      operationId: listIssues
      tags: [issues]
      summary: List all issues
      parameters:
        - name: date
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
          description: Start date for range filter (YYYY-MM-DD)
        - name: to
          in: query
          schema:
            type: string
          description: End date for range filter (YYYY-MM-DD)
        - name: areaId
          in: query
          schema:
            type: integer
        - name: assignedToId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of issues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Issue"
    post:
      operationId: createIssue
      tags: [issues]
      summary: Report an issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIssueRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"

  /issues/{id}/resolve:
    post:
      operationId: resolveIssue
      tags: [issues]
      summary: Resolve an issue
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"

  /issues/{id}/images:
    patch:
      operationId: updateIssueImages
      tags: [issues]
      summary: Attach before/after image paths to an issue
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIssueImagesRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"

  /issues/{id}/assign:
    patch:
      operationId: assignIssue
      tags: [issues]
      summary: Assign an issue to a staff member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignIssueRequest"
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"

  /issues/{id}/complete:
    patch:
      operationId: completeIssue
      tags: [issues]
      summary: Mark an issue complete with notes (staff)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteIssueRequest"
      responses:
        "200":
          description: Completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"

  /task-types:
    get:
      operationId: listTaskTypes
      tags: [taskTypes]
      summary: List all task type templates
      responses:
        "200":
          description: List of task types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskType"
    post:
      operationId: createTaskType
      tags: [taskTypes]
      summary: Create a new task type template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskTypeRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskType"

  /task-types/{id}:
    put:
      operationId: updateTaskType
      tags: [taskTypes]
      summary: Update a task type template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskTypeRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskType"
    delete:
      operationId: deleteTaskType
      tags: [taskTypes]
      summary: Delete a task type template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  /task-types/reorder:
    post:
      operationId: reorderTaskTypes
      tags: [taskTypes]
      summary: Reorder task type templates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderTaskTypesRequest"
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCompleteResponse"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for a staff member
      parameters:
        - name: staffId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /notifications/mark-all-read:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications read for a staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkAllReadRequest"
      responses:
        "200":
          description: All marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCompleteResponse"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /dashboard:
    get:
      operationId: getDashboard
      tags: [tasks]
      summary: Get dashboard statistics
      parameters:
        - name: date
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    StaffMember:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
          enum: [staff, supervisor, admin]
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        active:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - name
        - role
        - active
        - createdAt

    CreateStaffMemberRequest:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
          enum: [staff, supervisor, admin]
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
      required:
        - name
        - role

    UpdateStaffMemberRequest:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
          enum: [staff, supervisor, admin]
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        active:
          type: boolean

    CleaningArea:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        terminal:
          type: string
        location:
          type: string
        sortOrder:
          type: integer
      required:
        - id
        - name
        - terminal
        - location
        - sortOrder

    Task:
      type: object
      properties:
        id:
          type: integer
        areaId:
          type: integer
        taskDate:
          type: string
        taskName:
          type: string
        taskOrder:
          type: integer
        completed:
          type: boolean
        completedAt:
          type: string
          nullable: true
        completedById:
          type: integer
          nullable: true
        completedByName:
          type: string
          nullable: true
        assignedToId:
          type: integer
          nullable: true
        assignedToName:
          type: string
          nullable: true
        isSpecial:
          type: boolean
        notes:
          type: string
          nullable: true
      required:
        - id
        - areaId
        - taskDate
        - taskName
        - taskOrder
        - completed
        - isSpecial

    CompleteTaskRequest:
      type: object
      properties:
        completedById:
          type: integer
      required:
        - completedById

    CompleteAllTasksRequest:
      type: object
      properties:
        areaId:
          type: integer
        date:
          type: string
        completedById:
          type: integer
      required:
        - areaId
        - date
        - completedById

    BatchCompleteResponse:
      type: object
      properties:
        updated:
          type: integer
      required:
        - updated

    Assignment:
      type: object
      properties:
        id:
          type: integer
        staffId:
          type: integer
        staffName:
          type: string
        areaId:
          type: integer
        areaName:
          type: string
        assignmentDate:
          type: string
        assignedById:
          type: integer
        assignedByName:
          type: string
        notes:
          type: string
          nullable: true
        isSpecial:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - staffId
        - staffName
        - areaId
        - areaName
        - assignmentDate
        - assignedById
        - assignedByName
        - isSpecial
        - createdAt

    CreateAssignmentRequest:
      type: object
      properties:
        staffId:
          type: integer
        areaId:
          type: integer
        assignmentDate:
          type: string
        assignedById:
          type: integer
        notes:
          type: string
          nullable: true
        isSpecial:
          type: boolean
      required:
        - staffId
        - areaId
        - assignmentDate
        - assignedById
        - isSpecial

    Issue:
      type: object
      properties:
        id:
          type: integer
        areaId:
          type: integer
        areaName:
          type: string
        reportedById:
          type: integer
        reportedByName:
          type: string
        assignedToId:
          type: integer
          nullable: true
        assignedToName:
          type: string
          nullable: true
        issueDate:
          type: string
        description:
          type: string
        severity:
          type: string
          enum: [low, medium, high]
        resolved:
          type: boolean
        resolvedAt:
          type: string
          nullable: true
        completionNotes:
          type: string
          nullable: true
        beforeImagePath:
          type: string
          nullable: true
        afterImagePath:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - areaId
        - areaName
        - reportedById
        - reportedByName
        - issueDate
        - description
        - severity
        - resolved
        - createdAt

    CreateIssueRequest:
      type: object
      properties:
        areaId:
          type: integer
        reportedById:
          type: integer
        description:
          type: string
        severity:
          type: string
          enum: [low, medium, high]
        beforeImagePath:
          type: string
          nullable: true
      required:
        - areaId
        - reportedById
        - description
        - severity

    AssignIssueRequest:
      type: object
      properties:
        assignedToId:
          type: integer
          nullable: true
        assignedById:
          type: integer
      required:
        - assignedById

    CompleteIssueRequest:
      type: object
      properties:
        completionNotes:
          type: string
          nullable: true
        completedById:
          type: integer
      required:
        - completedById

    UpdateIssueImagesRequest:
      type: object
      properties:
        beforeImagePath:
          type: string
          nullable: true
        afterImagePath:
          type: string
          nullable: true

    Notification:
      type: object
      properties:
        id:
          type: integer
        staffId:
          type: integer
        issueId:
          type: integer
          nullable: true
        type:
          type: string
          enum: [new_issue, issue_assigned, issue_completed]
        message:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - staffId
        - type
        - message
        - isRead
        - createdAt

    MarkAllReadRequest:
      type: object
      properties:
        staffId:
          type: integer
      required:
        - staffId

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    DashboardStats:
      type: object
      properties:
        date:
          type: string
        totalTasks:
          type: integer
        completedTasks:
          type: integer
        totalAreas:
          type: integer
        completedAreas:
          type: integer
        openIssues:
          type: integer
        areaProgress:
          type: array
          items:
            $ref: "#/components/schemas/AreaProgress"
      required:
        - date
        - totalTasks
        - completedTasks
        - totalAreas
        - completedAreas
        - openIssues
        - areaProgress

    AreaProgress:
      type: object
      properties:
        areaId:
          type: integer
        areaName:
          type: string
        terminal:
          type: string
        totalTasks:
          type: integer
        completedTasks:
          type: integer
        percentage:
          type: number
        assignedStaff:
          type: array
          items:
            type: string
      required:
        - areaId
        - areaName
        - terminal
        - totalTasks
        - completedTasks
        - percentage
        - assignedStaff

    TaskType:
      type: object
      properties:
        id:
          type: integer
        taskName:
          type: string
        taskOrder:
          type: integer
        active:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - taskName
        - taskOrder
        - active
        - createdAt

    CreateTaskTypeRequest:
      type: object
      properties:
        taskName:
          type: string
        taskOrder:
          type: integer
      required:
        - taskName

    UpdateTaskTypeRequest:
      type: object
      properties:
        taskName:
          type: string
        taskOrder:
          type: integer
        active:
          type: boolean

    ReorderTaskTypesRequest:
      type: object
      properties:
        orderedIds:
          type: array
          items:
            type: integer
      required:
        - orderedIds

    DeleteResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
