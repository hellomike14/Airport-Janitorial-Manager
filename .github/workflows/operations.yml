name: Inspector mailbox operations

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inspector-mailbox-operations
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Validate configuration
        shell: bash
        run: |
          test -n "$APP_URL" || (echo "Missing APP_URL repository secret" && exit 1)
          test -n "$CRON_SECRET" || (echo "Missing CRON_SECRET repository secret" && exit 1)

      - name: Sync inspector mailbox
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --retry 2 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/jobs/sync-mail"

      - name: Escalate overdue requests
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --retry 2 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/jobs/escalate"

      - name: Renew Microsoft webhook when needed
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --retry 2 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/jobs/renew-subscription"
