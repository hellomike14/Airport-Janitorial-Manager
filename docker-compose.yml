services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: airport_manager
      POSTGRES_USER: airport
      POSTGRES_PASSWORD: airport
    volumes:
      - airport_manager_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airport -d airport_manager"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://airport:airport@db:5432/airport_manager
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  airport_manager_data:
