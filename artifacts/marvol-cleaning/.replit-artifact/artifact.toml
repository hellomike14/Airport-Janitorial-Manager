kind = "web"
previewPath = "/"
title = "Marvol Facility Cleaning Management"
version = "1.0.0"
id = "artifacts/marvol-cleaning"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 20025
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/marvol-cleaning run dev"

[services.env]
PORT = "20025"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/marvol-cleaning", "run", "build"]
publicDir = "artifacts/marvol-cleaning/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
