packages:
  "recharts": "Interactive charts and progress visualizations for the dashboard"
  "date-fns": "Easy date manipulation and formatting for daily tasks and assignments"
  "react-hook-form": "Form state management"
  "@hookform/resolvers": "Zod resolver for form validation"
  "clsx": "Utility for constructing className strings conditionally"
  "tailwind-merge": "Utility function to efficiently merge Tailwind CSS classes"
  "lucide-react": "Beautiful, consistent icons for the UI"

images:
  - path: "artifacts/marvol-cleaning/public/images/auth-bg.png"
    description: "Abstract geometric background in dark navy and subtle glowing blue lines, professional corporate airport style"
    aspect_ratio: "16:9"
  - path: "artifacts/marvol-cleaning/public/images/logo-mark.png"
    description: "Minimalist letter M logo mark in bright white on transparent background, modern aviation facility style"
    aspect_ratio: "1:1"

notes:
  - "App assumes standard REST API structure generated by Orval under @workspace/api-client-react"
  - "Dates are passed as YYYY-MM-DD strings"
